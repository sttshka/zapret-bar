# Сборка установочного образа и публикация релиза.
# Новая версия: поднять CFBundleShortVersionString в Resources/Info.plist,
# затем `git tag v<версия> && git push origin v<версия>`.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Собрать ZapretBar.dmg (Apple Silicon + Intel)
        run: scripts/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ZapretBar-dmg
          path: dist/*.dmg

      - name: Опубликовать релиз
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          generate_release_notes: true
